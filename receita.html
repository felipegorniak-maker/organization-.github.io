<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançar Receita - Associação Apolo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800 pb-12">

    <!-- Cabeçalho -->
    <header class="bg-indigo-900 text-white shadow-md py-6 px-8 sticky top-0 z-40">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hand-holding-dollar text-2xl text-emerald-400"></i>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Associação Apolo</h1>
                    <p class="text-xs text-indigo-200">Lançamento de Entrada / Receita</p>
                </div>
            </div>
            <span class="bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-semibold">
                + Entrada
            </span>
        </div>
    </header>

    <!-- Botão Voltar Alinhado -->
    <div class="max-w-2xl mx-auto px-4 mt-6 w-full">
        <a href="financas.html" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-center gap-2 transition group">
            <i class="fa-solid fa-arrow-left text-indigo-600 group-hover:-translate-x-1 transition-transform"></i>
            <span>Voltar para o Menu de Finanças</span>
        </a>
    </div>

    <!-- Conteúdo Principal / Formulário -->
    <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-emerald-600"></i>
                Registrar Nova Receita
            </h2>

            <form id="formReceita" class="space-y-4">
                
                <!-- Data e Categoria -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Data da Receita *</label>
                        <input type="date" id="dataReceita" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Categoria *</label>
                        <select id="categoriaReceita" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                            <option value="">A carregar categorias...</option>
                        </select>
                    </div>
                </div>

                <!-- Descrição -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição / Origem *</label>
                    <input type="text" id="descricaoReceita" placeholder="Ex: Pagamento da locação do salão - João da Silva" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <!-- Valor e Forma de Pagamento -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Valor (R$) *</label>
                        <input type="number" step="0.01" id="valorReceita" placeholder="0.00" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-emerald-700 font-bold">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Forma de Recebimento *</label>
                        <select id="formaPagamento" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                            <option value="PIX">PIX</option>
                            <option value="Dinheiro">Dinheiro em Espécie</option>
                            <option value="Transferência">Transferência Bancária</option>
                            <option value="Cartão">Cartão de Débito/Crédito</option>
                        </select>
                    </div>
                </div>

                <!-- Comprovante -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">
                        <i class="fa-solid fa-paperclip text-indigo-600 mr-1"></i> Comprovante (Opcional - PDF, Imagem ou Foto)
                    </label>
                    <input type="file" id="arquivoComprovante" accept=".pdf, image/png, image/jpeg, image/jpg" capture="environment" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    <p class="text-[10px] text-slate-400 mt-1">No telemóvel, pode selecionar um ficheiro ou tocar para abrir a câmara.</p>
                </div>

                <!-- Observação -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Observações (Opcional)</label>
                    <textarea id="obsReceita" rows="2" placeholder="Ex: Comprovante referente ao PIX nº 12345" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>

                <!-- Botão Salvar -->
                <button type="submit" id="btnSalvar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Salvar Receita</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Associação de Moradores do Conjunto Apolo &copy; 2026 - Todos os direitos reservados.
    </footer>

    <script>
        document.getElementById('dataReceita').value = new Date().toISOString().split('T')[0];

        const firebaseConfig = {
            apiKey: "AIzaSyDkJAyKwwpI2-0JuupYqDbRge0aBvKP8EI",
            authDomain: "contratos-apolo.firebaseapp.com",
            projectId: "contratos-apolo",
            storageBucket: "contratos-apolo.firebasestorage.app",
            messagingSenderId: "259554157159",
            appId: "1:259554157159:web:7b37146ae4bc1090b22ac2",
            measurementId: "G-YXMMKSGY7B"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Carrega automaticamente as categorias de RECEITA do módulo de Categorias
        async function carregarCategoriasReceita() {
            const select = document.getElementById('categoriaReceita');
            try {
                const snapshot = await db.collection("financeiro_categorias").where("tipo", "==", "RECEITA").orderBy('nome').get();
                select.innerHTML = '<option value="">Selecione a categoria...</option>';
                
                if (snapshot.empty) {
                    select.innerHTML = '<option value="">Nenhuma categoria cadastrada</option>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const cat = docSnap.data();
                    select.innerHTML += `<option value="${cat.nome}">${cat.nome}</option>`;
                });
            } catch (error) {
                console.error("Erro ao carregar categorias:", error);
                select.innerHTML = '<option value="">Erro ao carregar categorias</option>';
            }
        }

        // Função para enviar o arquivo para o Firebase Storage
        async function uploadParaStorage(file) {
            if (!file) return null;
            const nomeUnico = Date.now() + '_' + file.name;
            const storageRef = firebase.storage().ref().child('comprovantes/' + nomeUnico);
            const snapshot = await storageRef.put(file);
            const downloadURL = await snapshot.ref.getDownloadURL();
            return downloadURL;
        }

        document.getElementById('formReceita').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Enviando foto e salvando...`;

            try {
                let arquivoUrl = null;
                let nomeArquivo = null;
                const inputFile = document.getElementById('arquivoComprovante');
        
            if (inputFile.files.length > 0) {
                const file = inputFile.files[0];
                nomeArquivo = file.name;
                arquivoUrl = await uploadParaStorage(file); // Envia para o Storage e pega o link
            }

            const dados = {
                data: document.getElementById('dataReceita').value,
                categoria: document.getElementById('categoriaReceita').value,
                descricao: document.getElementById('descricaoReceita').value,
                valor: parseFloat(document.getElementById('valorReceita').value),
                formaPagamento: document.getElementById('formaPagamento').value,
                observacao: document.getElementById('obsReceita').value,
                comprovanteNome: nomeArquivo,
                comprovanteArquivo: arquivoUrl, // Salva o link do Storage em vez do Base64
                tipo: 'RECEITA',
                criadoEm: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("financeiro_movimentacoes").add(dados);
            alert("✅ Receita registrada com sucesso!");
            document.getElementById('formReceita').reset();
            document.getElementById('dataReceita').value = new Date().toISOString().split('T')[0];
            carregarCategoriasReceita();
        } catch (error) {
            console.error("Erro ao salvar receita:", error);
            alert("⚠️ Erro ao registrar receita. Verifique o tamanho ou conexão.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Salvar Receita`;
        }
    });
        window.onload = () => {
            carregarCategoriasReceita();
        };
    </script>
</body>
</html>
