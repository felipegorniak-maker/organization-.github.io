<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias e Centros de Custos - Associação Apolo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="permissoes.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800 pb-12">

    <!-- Cabeçalho -->
    <header class="bg-indigo-900 text-white shadow-md py-6 px-8 sticky top-0 z-40">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-folder-tree text-2xl text-purple-400"></i>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Associação Apolo</h1>
                    <p class="text-xs text-indigo-200">Gestão de Categorias e Centros de Custos</p>
                </div>
            </div>
            <span class="bg-purple-600 text-white text-xs px-3 py-1 rounded-full font-semibold">
                📁 Estrutura
            </span>
        </div>
    </header>

    <!-- Botão Voltar Alinhado (max-w-2xl) -->
    <div class="max-w-2xl mx-auto px-4 mt-6 w-full">
        <a href="financas.html" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-center gap-2 transition group">
            <i class="fa-solid fa-arrow-left text-indigo-600 group-hover:-translate-x-1 transition-transform"></i>
            <span>Voltar para o Menu de Finanças</span>
        </a>
    </div>

    <!-- Conteúdo Principal -->
    <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- Formulário para Criar Nova Categoria -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-md font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-purple-600"></i> Adicionar Nova Categoria
            </h2>

            <form id="formCategoria" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nome da Categoria *</label>
                        <input type="text" id="nomeCategoria" placeholder="Ex: Manutenção de Portão, Festas" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Movimento *</label>
                        <select id="tipoCategoria" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none bg-white text-xs">
                            <option value="DESPESA">Saída / Despesa</option>
                            <option value="RECEITA">Entrada / Receita</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btnSalvarCat" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-xs">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Salvar Nova Categoria</span>
                </button>
            </form>
        </div>

        <!-- Lista de Categorias Cadastradas -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-md font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-tags text-purple-600"></i> Categorias Ativas no Sistema
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 text-slate-600 text-[11px] uppercase tracking-wider border-b border-slate-200">
                            <th class="p-3">Nome da Categoria</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCategoriasBody" class="divide-y divide-slate-100 text-xs">
                        <tr>
                            <td colspan="3" class="p-4 text-center text-slate-400">A carregar categorias...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Associação de Moradores do Conjunto Apolo &copy; 2026 - Todos os direitos reservados.
    </footer>

    <script>
        // Configuração do Firebase (Substitua pelas suas chaves)
        const firebaseConfig = {
            apiKey: "AIzaSyDkJAyKwwpI2-0JuupYqDbRge0aBvKP8EI",
            authDomain: "contratos-apolo.firebaseapp.com",
            projectId: "contratos-apolo",
            storageBucket: "contratos-apolo.firebasestorage.app",
            messagingSenderId: "259554157159",
            appId: "1:259554157159:web:7b37146ae4bc1090b22ac2",
            measurementId: "G-YXMMKSGY7B"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Carregar Categorias do Firebase
        async function carregarCategorias() {
            const tbody = document.getElementById('tabelaCategoriasBody');
            tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> A carregar...</td></tr>`;

            try {
                const snapshot = await db.collection("financeiro_categorias").orderBy('nome').get();
                let html = '';
                let contador = 0;

                snapshot.forEach(docSnap => {
                    contador++;
                    const cat = docSnap.data();
                    const id = docSnap.id;
                    const isReceita = cat.tipo === 'RECEITA';
                    const colunaAcoes = devePermitirEscrita() ? 
                        `<button onclick="excluirCategoria('${id}')" title="Excluir Categoria" class="text-slate-400 hover:text-rose-600 p-1 transition"><i class="fa-solid fa-trash-can"></i></button>` : 
                        `<span class="text-slate-300">-</span>`;

                    html += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 font-semibold text-slate-700">${cat.nome}</td>
                            <td class="p-3">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${isReceita ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${cat.tipo}</span>
                            </td>
                            <td class="p-3 text-center">${colunaAcoes}</td>
                        </tr>
                    `;
                });

                if (contador === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">Nenhuma categoria customizada cadastrada.</td></tr>`;
                } else {
                    tbody.innerHTML = html;
                }
            } catch (error) {
                console.error("Erro ao carregar categorias:", error);
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-rose-500">Erro ao carregar do Firebase.</td></tr>`;
            }
        }

        // Salvar Nova Categoria
        document.getElementById('formCategoria').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvarCat');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Salvando...`;

            try {
                const novaCat = {
                    nome: document.getElementById('nomeCategoria').value.trim(),
                    tipo: document.getElementById('tipoCategoria').value,
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection("financeiro_categorias").add(novaCat);
                alert("✅ Categoria criada com sucesso!");
                document.getElementById('formCategoria').reset();
                carregarCategorias();
            } catch (error) {
                console.error("Erro ao salvar categoria:", error);
                alert("⚠️ Erro ao salvar categoria.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Salvar Nova Categoria`;
            }
        });

        // Excluir Categoria
        async function excluirCategoria(id) {
            if (confirm("Tem certeza de que deseja excluir esta categoria?")) {
                try {
                    await db.collection("financeiro_categorias").doc(id).delete();
                    alert("🗑️ Categoria excluída com sucesso!");
                    carregarCategorias();
                } catch (error) {
                    console.error("Erro ao excluir:", error);
                    alert("⚠️ Erro ao excluir categoria.");
                }
            }
        }

        window.onload = () => {
            carregarCategorias();
        };
    </script>
</body>
</html>
