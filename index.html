<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Associação Apolo</title>
    <!-- Carregamento do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
	<script src="permissoes.js"></script>
	<!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
	<script>
    	// Verifica se existe um perfil na sessão atual. Se fechar o navegador, isso limpa-se.
    	if (!sessionStorage.getItem('perfilApolo')) {
        	window.location.href = "login.html";
    	}
	</script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800">

<!-- Cabeçalho do Painel -->
    <header class="bg-indigo-900 text-white shadow-md py-6 px-8">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">Associação Apolo</h1>
                <p class="text-indigo-200 text-sm mt-1">Painel de Gestão e Controle Administrativo</p>
            </div>
            
            <!-- Área do Indicador e Botão Sair -->
            <div class="mt-4 sm:mt-0 flex items-center gap-3">
                <div class="bg-indigo-800 px-4 py-2 rounded-lg text-xs font-medium text-indigo-100 border border-indigo-700">
                    📅 Sistema Integrado em Tempo Real
                </div>
                
                <!-- Botão de Sair com limpeza de sessionStorage -->
                <button onclick="fazerLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Script de Logout -->
    <script>
        function fazerLogout() {
            // Limpa os dados da sessão atual
            sessionStorage.clear(); 
            
            // Encerra a sessão no Firebase e redireciona para o login
            firebase.auth().signOut().then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Erro ao terminar sessão:", error);
                window.location.href = "login.html";
            });
        }
    </script>

    <!-- Conteúdo Principal / Grade de Botões -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
        <h2 class="text-lg font-semibold text-slate-700 mb-6 border-b pb-2">Menu Principal</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            
            <!-- 1. SALÃO -->
            <a href="salao.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1">
    		<div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
        	    🏢
    		</div>
    		<h3 class="font-bold text-slate-800 mb-1">SALÃO</h3>
    		<p class="text-xs text-slate-500">Gerenciar temas ligados ao Salão</p>
	    </a>

            <!-- 2. QUADRA POLIESPORTIVA -->
            <button onclick="alert('Módulo em desenvolvimento!')" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1">
                <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    🥅
                </div>
                <h3 class="font-bold text-slate-800 mb-1">QUADRA POLIESPORTIVA</h3>
                <p class="text-xs text-slate-500">Gerenciar temas ligados a Quadra Poliesportiva</p>
            </button>

            <!-- 3. QUADRA DE AREIA -->
            <button onclick="alert('Módulo em desenvolvimento!')" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1 w-full">
                <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                    🏐
                </div>
                <h3 class="font-bold text-slate-800 mb-1">QUADRA DE AREIA</h3>
                <p class="text-xs text-slate-500">Gerenciar temas ligados a Quadra de Areia</p>
            </button>

            <!-- 4. FINANÇAS (Agora ligado ao financas.html) -->
            <a href="financas.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1 w-full">
                <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                    💰
                </div>
                <h3 class="font-bold text-slate-800 mb-1">FINANÇAS</h3>
                <p class="text-xs text-slate-500">Controle de receitas e despesas</p>
            </a>

            <!-- 5. LISTA DE SÓCIOS -->
            <button onclick="alert('Módulo em desenvolvimento!')" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1 w-full">
                <div class="w-14 h-14 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                    👥
                </div>
                <h3 class="font-bold text-slate-800 mb-1">LISTA DE SÓCIOS</h3>
                <p class="text-xs text-slate-500">Cadastro e dados dos associados</p>
            </button>

            <!-- 6. MANUTENÇÃO -->
            <button onclick="alert('Módulo em desenvolvimento!')" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1 w-full">
                <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-rose-600 group-hover:text-white transition-colors">
                    🛠️
                </div>
                <h3 class="font-bold text-slate-800 mb-1">MANUTENÇÃO</h3>
                <p class="text-xs text-slate-500">Registro de reparos na sede</p>
            </button>

            <!-- 7. ATAS DE REUNIÃO -->
            <button onclick="alert('Módulo em desenvolvimento!')" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1 w-full">
                <div class="w-14 h-14 bg-cyan-50 text-cyan-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-cyan-600 group-hover:text-white transition-colors">
                    📋
                </div>
                <h3 class="font-bold text-slate-800 mb-1">ATAS DE REUNIÃO</h3>
                <p class="text-xs text-slate-500">Documentação e histórico de assembleias</p>
            </button>

            <!-- 8. CONFIGURAÇÕES -->
            <button onclick="alert('Módulo em desenvolvimento!')" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 flex flex-col items-center text-center group hover:-translate-y-1 w-full">
                <div class="w-14 h-14 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-slate-700 group-hover:text-white transition-colors">
                    ⚙️
                </div>
                <h3 class="font-bold text-slate-800 mb-1">CONFIGURAÇÕES</h3>
                <p class="text-xs text-slate-500">Parâmetros e dados da associação</p>
            </button>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Associação de Moradores do Conjunto Apolo &copy; 2026 - Todos os direitos reservados.
    </footer>
<script>
    // Inicializa o Firebase no index.html (caso ainda não esteja inicializado)
    const firebaseConfig = {
        apiKey: "AIzaSyDkJAyKwwpI2-0JuupYqDbRge0aBvKP8EI",
        authDomain: "contratos-apolo.firebaseapp.com",
        projectId: "contratos-apolo",
        storageBucket: "contratos-apolo.firebasestorage.app",
        messagingSenderId: "259554157159",
        appId: "1:259554157159:web:7b37146ae4bc1090b22ac2",
        measurementId: "G-YXMMKSGY7B"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // Função chamada quando o utilizador clica no botão "Sair"
    function fazerLogout() {
        // Limpa os dados da sessão atual
        sessionStorage.clear(); 
        
        // Termina a sessão no Firebase e redireciona para o login
        firebase.auth().signOut().then(() => {
            window.location.href = "login.html";
        }).catch((error) => {
            console.error("Erro ao terminar sessão:", error);
            window.location.href = "login.html";
        });
    }
</script>
</body>
</html>
